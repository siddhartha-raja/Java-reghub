services:
  mysql:
    image: mysql:8.4
    container_name: java-reghub-mysql
    environment:
      MYSQL_DATABASE: reghub
      MYSQL_USER: reghub
      MYSQL_PASSWORD: reghub_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
