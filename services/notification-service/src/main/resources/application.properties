spring.application.name=notification-service
server.port=8081

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:notification-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.reghub.notification.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.reghub.notification.event.PostCreatedEvent
spring.kafka.listener.missing-topics-fatal=false

app.kafka.topic.post-created=${APP_KAFKA_TOPIC_POST_CREATED:post.created}
