spring.application.name=java-reghub
debug=false

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/reghub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:reghub}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:reghub_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.servlet.session.tracking-modes=cookie
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

app.aws.region=${AWS_REGION:us-east-1}
app.aws.s3.bucket=${AWS_S3_BUCKET:design-genesis-dev}
app.kafka.topic.post-created=${APP_KAFKA_TOPIC_POST_CREATED:post.created}
app.kafka.topic.post-deleted=${APP_KAFKA_TOPIC_POST_DELETED:post.deleted}
