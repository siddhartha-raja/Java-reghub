spring.application.name=java-reghub
debug=false

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/reghub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:reghub}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:reghub_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.servlet.session.tracking-modes=cookie

app.aws.region=${AWS_REGION:us-east-1}
app.aws.s3.bucket=${AWS_S3_BUCKET:design-genesis-dev}
